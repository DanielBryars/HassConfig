# Service Lights — Olimex ESP32-PoE-ISO driving 3x MCP23017 -> relay drivers.
# Modernised from DanielBryars/HomeAutomation esp32Yml/service_lights.yml (ESPHome 1.13.6, 2019).
# See docs/service-lights/README.md for wiring, photos and the Nov 2026 incident.
#
# Switch names are deliberately IDENTICAL to the 2019 firmware so Home Assistant keeps
# the same entity IDs (switch.light_bank_N_pin_NN) and dashboards keep working.

substitutions:
  name: service_lights          # unchanged: HA's ESPHome entry and mDNS use this hostname
  friendly_name: Service Lights

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-poe-iso
  framework:
    type: arduino

ethernet:
  type: LAN8720
  mdc_pin: GPIO23
  mdio_pin: GPIO18
  clk:
    pin: GPIO17
    mode: CLK_OUT
  phy_addr: 0
  power_pin: GPIO12

logger:

# No API encryption yet, to match the existing HA integration. Adding `encryption:` later
# means re-entering the key in HA (Settings > Devices > ESPHome > Service Lights > Reconfigure).
api:

ota:
  - platform: esphome
    password: !secret service_lights_ota_password

i2c:
  id: bus_lights
  sda: GPIO13   # EXT2 pin 10 — blue jumper
  scl: GPIO16   # EXT2 pin 7  — yellow jumper (the one that fell off, Nov 2026)
  scan: true
  frequency: 100kHz

mcp23017:
  - id: mcp23017_lights_20
    address: 0x20
  - id: mcp23017_lights_21
    address: 0x21
  - id: mcp23017_lights_22
    address: 0x22

# --- Health / maintenance (none of this existed in 2019) ---
button:
  - platform: restart
    name: Restart

sensor:
  - platform: uptime
    name: Uptime

binary_sensor:
  - platform: status
    name: Status
  # Turns ON when any expander failed to answer at boot (e.g. an I2C wire is off).
  # The 2019 firmware failed silently in this situation.
  - platform: template
    name: I2C Expander Problem
    device_class: problem
    entity_category: diagnostic
    lambda: |-
      return id(mcp23017_lights_20).is_failed() ||
             id(mcp23017_lights_21).is_failed() ||
             id(mcp23017_lights_22).is_failed();

text_sensor:
  - platform: version
    name: ESPHome Version

# --- Outputs ---
# Each output holds its relay on/off directly, so HA state == light state.
# RESTORE_DEFAULT_OFF puts every light back how it was after a reboot
# (state saved to flash), defaulting to off if nothing is stored.
switch:
  # ---------------- Bank 0 (mcp23017_lights_20, 0x20) ----------------
  - platform: gpio
    name: "Light Bank 0 Pin #00"   # Toilet
    id: light_bank_0_pin_00
    restore_mode: RESTORE_DEFAULT_OFF
    pin:
      mcp23xxx: mcp23017_lights_20
      number: 0
      mode:
        output: true
      inverted: true
